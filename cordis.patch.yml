# dsh-window-control bundle layer.
#
# Declared via the `dsh.bundle.patch` manifest in package.json, so
# `dsh plugin add dsh-window-control` (and the dsh-market install flow)
# mounts this insert automatically.
#
# The browser half (lib/client.js) owns the UI and all window behaviour; the
# host half (lib/index.js) is the installer: the Host sandbox has no Electron
# API at all, so the window/quit IPC channels have to be injected into
# resources/app.asar once (lib/asar-bridge.js), which the host half does
# automatically on every DSH launch.
- insert:
    - id: dsh-window-control
      name: dsh-window-control
